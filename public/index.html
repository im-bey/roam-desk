<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ROAM Stock Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one narrow working column. Sticky header with sync status, five big tabs (Stock, Bags, Slips, Money, Photos), big tap targets for older staff. */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --ink:#16231F; --muted:#5B6B66; --line:#D9E2DE;
  --accent:#1D6B58; --accent-ink:#FFFFFF; --accent-soft:#DDEEE8;
  --good:#1D7A46; --good-soft:#DCF1E4; --warn:#9A5B00; --warn-soft:#FBEBCB; --bad:#B3261E; --bad-soft:#F8DAD7;
  --shadow:0 1px 2px rgba(22,35,31,.08),0 6px 18px rgba(22,35,31,.06);
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A17; --surface:#16251F; --ink:#E8F0EC; --muted:#93A59E; --line:#2A3B35;
  --accent:#4FC3A1; --accent-ink:#06231B; --accent-soft:#1B3A31;
  --good:#5BD28C; --good-soft:#173A27; --warn:#F2B24A; --warn-soft:#3F2F0E; --bad:#FF8A80; --bad-soft:#4A1E1B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A17; --surface:#16251F; --ink:#E8F0EC; --muted:#93A59E; --line:#2A3B35;
  --accent:#4FC3A1; --accent-ink:#06231B; --accent-soft:#1B3A31;
  --good:#5BD28C; --good-soft:#173A27; --warn:#F2B24A; --warn-soft:#3F2F0E; --bad:#FF8A80; --bad-soft:#4A1E1B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:700 24px/1.1 var(--display);margin:0;letter-spacing:-.01em}
.sync{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)}.dot.err{background:var(--bad)}.dot.busy{background:var(--warn)}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.fill{background:var(--bad);color:#fff}
.acts.more{margin-top:-2px}
.acts.more .btn{flex:0 1 auto;min-height:36px;font-size:14px;padding:0 12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
nav button{min-height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;padding:0 2px}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{padding-top:16px;display:flex;flex-direction:column;gap:16px}
.banner{border-radius:12px;padding:14px 16px;background:var(--warn-soft);color:var(--ink);border:1.5px solid var(--warn)}
.banner b{display:block;margin-bottom:2px}
.banner.bad{background:var(--bad-soft);border-color:var(--bad)}
.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left}
.chip .n{font:700 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.chip .l{font-size:15px;color:var(--muted)}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.tools{display:grid;grid-template-columns:1fr auto;gap:8px}
.tools input,.tools select,.field input,.field select{min-height:46px;width:100%;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:0 12px}
.tools select{max-width:190px}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center}
.row .name{font-weight:600;overflow-wrap:anywhere}
.row .cat{font-size:13px;color:var(--muted)}
.qty{text-align:right}
.prices{display:grid;grid-template-columns:repeat(3,auto);gap:6px 16px;margin-top:6px;justify-content:start}
.prices .l{display:block;font-size:12px;color:var(--muted)}.prices.profit{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line,#ddd)}.prices b{font-variant-numeric:tabular-nums}
.sect{background:var(--bg);border-radius:10px;padding:10px 12px}.sect h4{margin:0 0 6px;font:700 15px var(--display)}
.ln{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:15px;font-variant-numeric:tabular-nums}.ln span:first-child{overflow-wrap:anywhere}
.ln.tot{border-top:1.5px solid var(--line);margin-top:4px;padding-top:8px;font-weight:700}.ln.sub{color:var(--muted)}.ln.neg span:last-child{color:var(--bad)}
.qty .n{font:700 28px/1 var(--display);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:99px}
.pill.ok{background:var(--good-soft);color:var(--good)}.pill.low{background:var(--warn-soft);color:var(--warn)}.pill.out{background:var(--bad-soft);color:var(--bad)}
.acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{flex:1 1 90px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1.5px dashed var(--line);border-radius:12px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px}
.tile .l{font-size:14px;color:var(--muted);font-weight:600}
.tile .v{font:700 30px/1.15 var(--display);margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .h{font-size:13px;color:var(--muted);margin-top:4px}
.tile.good .v{color:var(--good)}.tile.bad .v{color:var(--bad)}
.tile.bk{cursor:pointer;position:relative;transition:transform .15s,box-shadow .15s,border-color .15s}.tile.bk.open{grid-column:1/-1}.tile.bk .chev{font-size:12px;margin-left:6px}
.tile.bk:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.14);border-color:var(--good)}
.tile.salescard{margin-bottom:10px}
.tile.bk .clk{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;letter-spacing:.02em;padding:4px 9px;border-radius:999px;background:var(--good);color:#fff;display:flex;gap:5px;align-items:center}
.tile.bk .l{padding-right:84px}
.tile.bk .prog{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 4px}.tile.bk .prog>i{display:block;height:100%;background:var(--good);border-radius:99px}
@media (prefers-reduced-motion:reduce){.tile.bk{transition:none}.tile.bk:hover{transform:none}}
.tile.bk:focus-visible{outline:3px solid var(--good);outline-offset:2px}
.bkd{margin-top:12px;border-top:1.5px solid var(--line);padding-top:10px;cursor:default}
.bkd .ln{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:15px;font-variant-numeric:tabular-nums}
.bkd .ln.neg span:last-child{color:var(--bad)}.bkd .ln.tot{font-weight:700;border-top:1px solid var(--line)}
h2{font:700 19px/1.2 var(--display);margin:6px 0 0}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar .t{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.bar .t span:last-child{font-variant-numeric:tabular-nums}
.bar .track{height:12px;border-radius:99px;background:var(--accent-soft);margin-top:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:99px;min-width:0}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.act-add{color:var(--good);font-weight:700}.act-sold{color:var(--accent);font-weight:700}.act-remove,.act-used{color:var(--warn);font-weight:700}
.bag{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.bag .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.bag h3{font:700 19px/1.2 var(--display);margin:0;overflow-wrap:anywhere}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.nums div{background:var(--bg);border-radius:10px;padding:8px 10px}
.nums .l{font-size:12px;color:var(--muted)}.nums .v{font-weight:700;font-variant-numeric:tabular-nums}
.items{display:flex;flex-direction:column}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .x{min-height:36px;min-width:36px;border-radius:8px;border:1.5px solid var(--line);background:transparent;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(10,20,17,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow:auto}
@media (min-width:640px){.overlay{align-items:center}.sheet{border-radius:18px}}
.sheet h3{font:700 22px/1.15 var(--display);margin:0;overflow-wrap:anywhere}
.sheet .sub{color:var(--muted);margin-top:-8px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:15px}
.stepper{display:grid;grid-template-columns:56px 1fr 56px;gap:8px}
.stepper button{min-height:56px;font-size:26px;font-weight:700;border-radius:10px;border:1.5px solid var(--line);background:var(--bg)}
.stepper input{min-height:56px;text-align:center;font:700 26px var(--display);border-radius:10px;border:1.5px solid var(--line);background:var(--surface);width:100%}
.preview{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-weight:600}
.err{color:var(--bad);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:30;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.note{color:var(--muted);font-size:14px}
.drop{border:2.5px dashed var(--accent);background:var(--accent-soft);border-radius:14px;padding:26px 16px;text-align:center;font-weight:600}
.drop.over{background:var(--surface)}.drop small{display:block;font-weight:400;color:var(--muted);margin-top:6px}
.pend{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px}
.pend img{width:56px;height:56px;object-fit:cover;border-radius:8px;background:var(--bg)}
.pend select{min-height:42px;width:100%;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:0 8px;margin-top:4px}
.sl{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.sl.warn{border-color:var(--warn)}.sl .t{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.sl select,.sl input[type=text],.sl input:not([type]){min-height:44px;width:100%;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:0 8px}
.sl .g3{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}.sl .g3 label{font-size:12px;color:var(--muted);display:block}
.sl .x{min-height:44px;min-width:44px;border-radius:8px;border:1.5px solid var(--line);background:transparent;color:var(--muted)}
.sl .cn{font-size:14px;color:var(--warn)}.sl .cn label{display:flex;gap:8px;align-items:center;color:var(--ink)}.sl .cn input{width:22px;height:22px}
.thumb{width:100%;max-height:180px;object-fit:contain;border-radius:10px;background:var(--bg)}
.pill.wait{background:var(--warn-soft);color:var(--warn)}.pill.none{background:var(--bg);color:var(--muted)}
.prow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.prow:last-child{border-bottom:0}.prow span:first-child{overflow-wrap:anywhere}
@media (max-width:460px){nav button{font-size:14px}.nums{grid-template-columns:repeat(2,minmax(0,1fr))}.tile .v{font-size:25px}.tools{grid-template-columns:1fr}.tools select{max-width:none}}
@media (prefers-reduced-motion:no-preference){.overlay{animation:fade .15s ease-out}@keyframes fade{from{opacity:0}}}
/* hover and press feedback so every button looks clickable */
button:not(:disabled),.drop{cursor:pointer;transition:background-color .15s,border-color .15s,box-shadow .15s,transform .1s}
.btn:not(:disabled):hover,nav button:not(:disabled):hover,.chip:hover,.item .x:hover,.sl .x:hover{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 2px 8px rgba(0,0,0,.14);transform:translateY(-1px)}
.btn.primary:not(:disabled):hover,nav button[aria-selected="true"]:hover{background:var(--accent);filter:brightness(1.12);box-shadow:0 3px 10px rgba(0,0,0,.28)}
.btn.danger:not(:disabled):hover{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:not(:disabled):active,nav button:active,.chip:active{transform:translateY(0);box-shadow:none}
.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
</style>

<div class="wrap">
  <header>
    <div class="top">
      <h1>ROAM Stock Desk</h1>
      <div class="sync"><span class="dot busy" id="dot"></span><span id="syncText">Connecting…</span><button class="btn sm" id="refresh" type="button">Get latest</button></div>
    </div>
    <nav role="tablist" aria-label="Sections">
      <button role="tab" id="tab-stock" aria-selected="true" data-tab="stock" type="button">My Stock</button>
      <button role="tab" id="tab-bags" aria-selected="false" data-tab="bags" type="button">Freshi Bag</button>
      <button role="tab" id="tab-slips" aria-selected="false" data-tab="slips" type="button">Add Stock</button>
      <button role="tab" id="tab-money" aria-selected="false" data-tab="money" type="button">Money</button>
    </nav>
  </header>
  <main id="main"></main>
</div>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>

<script>
const SS = "13s7Ng4OrLFa_A0tkZMjMXSvvx0Z2CgBOaHhrlfVsxxk";
const SERVERS = ["Composio", "composio"];   // the connector is called "Composio" or "composio" depending on the account
let SERVER_USED = SERVERS[0];
const CHANNELS = ["Uber Eats", "WhatsApp", "Market", "Freshi"];
const chLbl = c => c === "WhatsApp" ? "WhatsApp/Webstore" : c;   // label only; the sheet keeps the value "WhatsApp"
// Rates live in the sheet tab "Assumptions" (loaded below). These are only fallbacks.
const A0 = {uberComm:0.30, vat:0.15, uberMargin:0.30, waMargin:null, minDisc:0.5, fee:0.25, pack:0};
let CAT_ID = "1oO3O6kdzqA7BmNq7hWlxQTOi3XOrTKhMyvpPVFglPJ8";   // WhatsApp catalogue sheet (Meta reads it). Overridden by the Assumptions tab.
const WA_TYPE = {"Donuts/Koeksisters":"Bakery", "Cakes":"Bakery", "Biscuits":"Bakery", "Chocolate":"Clusters", "Biltong":"Biltong", "Dried Fruit":"Snacks", "Pop-Corn":"Snacks", "Cool-Drink":"Drinks", "Bags":"Party Bags", "Party Boxes":"Party Bags"};
const MAX_B64 = 120000, CHUNK = 40000;   // a product photo is stored in the Photos tab as up to 3 text cells
const MAX_SLIP_B64 = 300000;               // a slip photo is stored in the Slips tab as up to 8 text cells (the agent files it to Drive by month)
const SLIP_COLS = ["I","J","K","L","M","N","O","P"];
const ZAR = new Intl.NumberFormat("en-ZA", {style:"currency", currency:"ZAR"});
const money = n => ZAR.format(Number(n) || 0);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = x => (typeof x === "number" ? x : (x === "" || x == null ? null : (isFinite(Number(x)) ? Number(x) : null)));

let mcp = null, sample = null;
const S = {assump:{...A0}, photos:{}, photoRows:1, pending:[], slips:[], slipRows:1, alias:{}, scan:null, canScan:false, wa:{sig:"", at:null, count:0, error:null}, tab:"stock", promos:[], noPromo:false, skip:{}, pc:{}, cat:[], bags:[], items:[], sum:{}, recent:[], q:"", category:"", filter:"all", loaded:false, error:null, busy:false, updated:null};

/* ---------- Sheet access (Composio -> Google Sheets, ROAM account) ---------- */
async function run(slug, args) {
  const key = localStorage.getItem("roamKey") || "";
  let r;
  try { r = await fetch("/api/sheets", {method:"POST", headers:{"content-type":"application/json", "x-dash-key":key}, body:JSON.stringify({slug, args})}); }
  catch (_) { const e = new Error("offline"); e.code = "server_unavailable"; throw e; }
  if (r.status === 401) { localStorage.removeItem("roamKey"); const e = new Error("Wrong or missing password."); e.code = "needs_auth"; throw e; }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || "The sheet did not accept that."); e.code = "sheet"; throw e; }
  return j.data;
}
function nowStamp() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
const appendLog = rows => run("GOOGLESHEETS_SPREADSHEETS_VALUES_APPEND", {spreadsheetId:SS, range:"'Stock Log'!A:L", valueInputOption:"RAW", insertDataOption:"INSERT_ROWS", values:rows});

async function load() {
  setStatus("busy", "Updating…");
  try {
    const d = await run("GOOGLESHEETS_BATCH_GET", {spreadsheet_id:SS, valueRenderOption:"UNFORMATTED_VALUE",
      ranges:["Catalogue!A1:U300", "'Freshi Bags'!A1:B100", "'Freshi Bag Items'!A1:D600", "Summary!A1:B30", "Summary!D2:K13", "Assumptions!A1:B12", "Photos!A1:F200", "Slips!A1:H400", "Aliases!A1:B600", "Promos!A1:N30", "Fees!A1:I22", "'Stock Log'!A1:L8000"]});
    const v = d.valueRanges.map(x => x.values || []);
    S.cat = v[0].slice(1).map((r, i) => ({row:i+2, name:r[0], category:r[1] || "Other", pack:num(r[2]) || 1, cost:num(r[3]) || 0,
      uber:num(r[4]), wa:num(r[5]), stock:num(r[6]) || 0, active:(r[8] || "Y") !== "N", typed:num(r[9]), gift:String(r[12] || ""), mgift:String(r[13] || "").split("|").map(x => x.trim()).filter(Boolean), mgq:num(r[14]) || 1, mid:String(r[15] || "").trim(), mtitle:String(r[16] || "").trim(), mdesc:String(r[17] || "").trim(), mcat:String(r[18] || "").trim(), mimg:String(r[19] || "").trim(), always:String(r[20] || "").trim().toUpperCase() === "Y"})).filter(p => p.name);

function netBreakdown(income, comm, profit, s) {

async function prepImage(file, sides = [1000, 800, 640], limit = MAX_B64) {
  const bmp = await createImageBitmap(file);
  for (const max of sides) {
    const sc = Math.min(1, max / Math.max(bmp.width, bmp.height)), w = Math.round(bmp.width * sc), h = Math.round(bmp.height * sc);
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); x.drawImage(bmp, 0, 0, w, h);
    for (const q of [0.85, 0.75, 0.65, 0.5]) { const b64 = c.toDataURL("image/jpeg", q).split(",")[1]; if (b64.length <= limit) return {b64, w, h}; }
  }
  throw new Error("That photo is too big. Try a smaller one.");
}
function addFiles(list) {
  [...list].filter(f => f.type.startsWith("image/")).forEach(f => S.pending.push({file:f, url:URL.createObjectURL(f), product:matchProduct(f.name)}));

}

    gsel && gsel.addEventListener("change", upd);
    f.addEventListener("submit", e => { e.preventDefault(); if (f.querySelector("#go").disabled) return;
      const c = calc(), pr = num(prEl.value), t = nowStamp(), ch = chEl.value, comm = ch === "Uber Eats" ? +(pr * S.assump.uberComm * (1 + S.assump.vat)).toFixed(2) : 0;
      const rows = [[t, "Bag: " + p.name, "SOLD", 1, ch, +pr.toFixed(2), +c.cost.toFixed(2), "Picks: " + c.items.map(x => cnt[x.name] + " " + x.name).join(", "), "", 0, 0, comm]];
      c.items.forEach(x => rows.push([t, x.name, "USED", cnt[x.name], "", "", 0, "In bag: " + p.name]));
      if (c.g) rows.push([t, c.g[1].name, "REMOVE", c.g[2], "", "", +c.giftCost.toFixed(2), "PROMO GIFT: Menu gift - " + p.name + " (" + c.g[0] + ")"]);
      submitWith(f, () => appendLog(rows), "Sold 1 × " + p.name);
    });
  });
}
function bagSoldDialog(b) {
  const info = bagInfo(b);
  if (!info.lines.length) { toast("Add items to this bag first."); return; }
  openSheet(`<h3>You sold a Freshi bag</h3><div class="sub">${esc(b.name)} · you receive ${money(info.payout)} per bag</div>
    <div class="field"><label for="qty">How many bags did you sell?</label>${stepper(1)}</div>
    <div class="preview" id="pv"></div><div class="err" id="err" role="alert"></div>
    <div class="two"><button class="btn" id="cancel" type="button">Cancel</button><button class="btn primary" id="go" type="submit">Save this sale</button></div>`, f => {
    const qty = wireStepper(f, upd);
    function short(n) { return info.lines.filter(l => (byName(l.product)?.stock ?? 0) < l.qty * n).map(l => l.product); }
    function upd() {
      const n = qty(), s = short(n), pv = f.querySelector("#pv");
      pv.textContent = s.length ? "Not enough stock: " + s.join(", ") : `You receive ${money(n * info.payout)}, profit ${money(n * info.profit)}. These come off stock: ` + info.lines.map(l => `${l.qty * n} × ${l.product}`).join(", ") + ".";
      pv.className = "preview" + (s.length ? " err" : ""); f.querySelector("#go").disabled = !n || s.length > 0;
    }
    upd();
    f.addEventListener("submit", e => { e.preventDefault(); const n = qty(); if (!n || short(n).length) return;
      const t = nowStamp();
      const rows = info.lines.map(l => [t, l.product, "USED", l.qty * n, "Freshi", "", 0, "In bag: " + b.name]);
      rows.push([t, "Bag: " + b.name, "SOLD", n, "Freshi", +(n * info.payout).toFixed(2), +(n * (info.cost + info.pack)).toFixed(2), ""]);
      submitWith(f, () => appendLog(rows), `Sold ${n} × ${b.name}`);
    });
  });
}

/* ---------- Events ---------- */
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('.tile.bk')) { e.preventDefault(); e.target.click(); } });
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-do],[data-filter]"); if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; render(); return; }
  if (t.dataset.filter) { S.filter = S.filter === t.dataset.filter ? "all" : t.dataset.filter; render(); return; }
  const row = Number(t.dataset.row), p = S.cat.find(x => x.row === row), b = S.bags.find(x => x.row === row);
  switch (t.dataset.do) {
    case "remove": case "sold": p && stockDialog(t.dataset.do, p); break;
    case "bagsell": p && bagSellDialog(p); break;
    case "nopromo": S.noPromo = !S.noPromo; render(); break;
    case "skippromo": { const n = t.dataset.n; if (S.skip[n]) delete S.skip[n]; else S.skip[n] = true; render(); break; }
    case "bk": S.bkOpen = S.bkOpen || {}; S.bkOpen[t.dataset.key] = !S.bkOpen[t.dataset.key]; render(); break;
    case "prodnew": prodNewDialog(); break;
    case "proddel": p && prodDelDialog(p); break;
    case "prodren": p && prodRenameDialog(p); break;
    case "bagdel": b && bagDelDialog(b); break;
    case "bagnew": bagNewDialog(); break;
    case "bagprice": b && bagPriceDialog(b); break;
    case "bagadd": b && bagAddDialog(b); break;
    case "bagsold": b && bagSoldDialog(b); break;
    case "slipmanual": slipManual(); break;
    case "slipnew": S.scan = null; render(); break;
    case "slipcancel": if (S.scan && S.scan.url) URL.revokeObjectURL(S.scan.url); S.scan = null; render(); break;
    case "slipadd": S.scan.lines.push(newLine()); render(); break;
    case "slipdel": S.scan.lines.splice(row, 1); if (!S.scan.lines.length) S.scan.lines.push(newLine()); render(); break;
    case "slipconfirm": confirmSlip(t); break;
    case "photosave": savePhotos(t); break;
    case "photoclear": S.pending.forEach(f => URL.revokeObjectURL(f.url)); S.pending = []; render(); break;
    case "rmitem": {
      const it = S.items.find(x => x.row === row); if (!it) break;
      t.disabled = true;
      run("GOOGLESHEETS_VALUES_UPDATE", {spreadsheet_id:SS, range:`'Freshi Bag Items'!A${row}:D${row}`, value_input_option:"RAW", values:[["", "", "", ""]]})
        .then(() => { toast("Removed " + it.product); load(); }).catch(err => { toast(explain(err)[0]); t.disabled = false; });
      break;
    }
  }
});
document.addEventListener("input", e => {
  const d = e.target.dataset && e.target.dataset.sl;
  if (d && S.scan) { const [i, f] = d.split(":"); S.scan.lines[Number(i)][f] = e.target.value; refreshSlip(Number(i)); return; }
  if (e.target.id === "snote" && S.scan) { S.scan.note = e.target.value; return; }
  if (e.target.id === "sread" && S.scan) { S.scan.total = num(e.target.value); checkDupe(S.scan); refreshSlip(); return; }
  if (e.target.id === "q") { S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = document.getElementById("q"); q.focus(); q.setSelectionRange(pos, pos); }
});
document.addEventListener("change", e => {
  if (e.target.id === "cat") { S.category = e.target.value; render(); }
  if (e.target.id === "files") { addFiles(e.target.files); }
  if (e.target.id === "sfile") { startScan(e.target.files[0]); }
  if (e.target.id === "sdupe" && S.scan) { S.scan.ack = e.target.checked; }
  if (e.target.dataset && e.target.dataset.slc != null && S.scan) { S.scan.lines[Number(e.target.dataset.slc)].upd = e.target.checked; }
  if (e.target.dataset && e.target.dataset.sl && S.scan) { const [i, f] = e.target.dataset.sl.split(":"); if (f === "product") { const l = S.scan.lines[Number(i)], p = byName(e.target.value); l.product = e.target.value; if (p && (l.price === "" || l.price == null)) { l.price = p.cost; const inp = document.querySelector(`[data-sl="${i}:price"]`); if (inp) inp.value = p.cost; } refreshSlip(Number(i)); } }
  if (e.target.dataset && e.target.dataset.pend != null) { S.pending[Number(e.target.dataset.pend)].product = e.target.value; }
});
const dz = e => e.target.closest && e.target.closest("#drop,#sdrop");
document.addEventListener("dragover", e => { const d = dz(e); if (d) { e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", e => { const d = dz(e); if (d) d.classList.remove("over"); });
document.addEventListener("drop", e => { const d = dz(e); if (d) { e.preventDefault(); d.classList.remove("over"); if (d.id === "sdrop") startScan(e.dataTransfer.files[0]); else addFiles(e.dataTransfer.files); } });
document.addEventListener("click", e => { const d = dz(e); if (d && e.target.type !== "file") document.getElementById(d.id === "sdrop" ? "sfile" : "files").click(); });
document.getElementById("refresh").addEventListener("click", () => load());
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.loaded && Date.now() - (S.updated?.getTime() || 0) > 60000) load(); });

(async function init() {
  render();
  S.canScan = false;
  if (!localStorage.getItem("roamKey")) { const k = prompt("ROAM Stock Desk password"); if (k) localStorage.setItem("roamKey", k.trim()); }
  load();
})();
</script>
